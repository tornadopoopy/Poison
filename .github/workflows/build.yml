name: Build Tornado Menu

on:
  push:
    branches:
      - tornado-menu-vr-modded-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted runner: no self-hosted machine is required.
    # Game dependencies still must be made available to this runner.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify build references
        shell: pwsh
        run: |
          $gameRefs = 'References/Managed/Assembly-CSharp.dll'
          $coreRefs = 'References/core/BepInEx.dll'
          $utillaRefs = 'References/Utilla/Utilla.dll'
          if (!(Test-Path $gameRefs) -or !(Test-Path $coreRefs) -or !(Test-Path $utillaRefs)) {
            throw 'Build references are missing on the hosted runner. Add compatible local reference files under References/Managed, References/core, and References/Utilla using an approved private dependency source. Do not commit proprietary Gorilla Tag assemblies into a public repository.'
          }
          Write-Host 'Found required reference files.'

      - name: Restore
        run: dotnet restore PoisonMenu.csproj

      - name: Build Release
        run: dotnet build PoisonMenu.csproj --configuration Release --no-restore -p:CI=TRUE

      - name: Confirm DLL exists
        shell: pwsh
        run: |
          $dll = 'bin\Release\netstandard2.1\TornadoMenu.dll'
          if (-not (Test-Path $dll)) { throw "Expected DLL not found: $dll" }
          Write-Host "Built $dll"

      - name: Upload Tornado Menu DLL
        uses: actions/upload-artifact@v4
        with:
          name: TornadoMenu-DLL
          path: bin/Release/netstandard2.1/TornadoMenu.dll
          if-no-files-found: error
