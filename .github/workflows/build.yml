name: Build Tornado Menu

on:
  push:
    branches:
      - tornado-menu-vr-modded-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted runner: no self-hosted machine is required.
    # Game dependencies still must be made available to this runner.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download private build dependencies
        shell: pwsh
        env:
          DEPS_TOKEN: ${{ secrets.TORNADO_DEPS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPS_TOKEN)) {
            throw 'Missing TORNADO_DEPS_TOKEN. Create a fine-grained PAT with Contents: Read on the private tornadopoopy/tornado-menu-build-deps repository, then set it as an Actions repository secret in Poison.'
          }
          $headers = @{
            Authorization = "Bearer $env:DEPS_TOKEN"
            Accept = 'application/vnd.github.raw+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $url = 'https://api.github.com/repos/tornadopoopy/tornado-menu-build-deps/contents/TornadoBuildReferences.zip?ref=main'
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile 'TornadoBuildReferences.zip'
          if (!(Test-Path 'TornadoBuildReferences.zip')) { throw 'Dependency download failed.' }
          Expand-Archive -LiteralPath 'TornadoBuildReferences.zip' -DestinationPath '.' -Force
          foreach ($file in @('References/Managed/Assembly-CSharp.dll', 'References/core/BepInEx.dll', 'References/Utilla/Utilla.dll')) {
            if (!(Test-Path $file)) { throw "Missing extracted dependency: $file" }
          }
          Write-Host 'Private build references extracted.'

      - name: Restore
        run: dotnet restore PoisonMenu.csproj

      - name: Build Release
        run: dotnet build PoisonMenu.csproj --configuration Release --no-restore -p:CI=TRUE

      - name: Confirm DLL exists
        shell: pwsh
        run: |
          $dll = 'bin\Release\netstandard2.1\TornadoMenu.dll'
          if (-not (Test-Path $dll)) { throw "Expected DLL not found: $dll" }
          Write-Host "Built $dll"

      - name: Upload Tornado Menu DLL
        uses: actions/upload-artifact@v4
        with:
          name: TornadoMenu-DLL
          path: bin/Release/netstandard2.1/TornadoMenu.dll
          if-no-files-found: error
